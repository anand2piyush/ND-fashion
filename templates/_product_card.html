<article class="product-card">
  <a class="product-image-wrap" href="/products/{{ product.id }}">
    {% if product.discount_percent %}
      <span class="discount-badge">{{ product.discount_percent }}% OFF</span>
    {% endif %}
    <img class="product-image" src="{{ product.image_url or '/static/images/product-placeholder.svg' }}" alt="{{ product.name }}">
  </a>
  <div class="product-info">
    <p class="eyebrow">{{ product.brand }}</p>
    <h3><a href="/products/{{ product.id }}">{{ product.name }}</a></h3>
    <p class="product-short">{{ product.short_detail }}</p>
    <div class="price-row">
      <strong>{{ (product.price * (100 - product.discount_percent) / 100) | money }}</strong>
      {% if product.discount_percent %}<del>{{ product.price | money }}</del>{% endif %}
    </div>
  </div>
</article>
